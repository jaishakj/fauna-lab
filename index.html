<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Field Guide — Vol. I · Insecta &amp; Aves</title>
  <meta name="description" content="An interactive field guide to insects and birds — every specimen with a real, orbit-able 3D model, field notes, and side-by-side comparison." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23264653'/%3E%3Cpath d='M16 8v16M16 10C11 5 5 6 5 12c0 5 5 7 11 5M16 10c5-5 11-4 11 2 0 5-5 7-11 5' stroke='%23e9c46a' stroke-width='1.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button id="menuToggle" class="menu-toggle" aria-label="Toggle index">
    <span></span><span></span><span></span>
  </button>
  <div id="scrim" class="scrim"></div>

  <div class="app">
    <aside id="sidebar" class="sidebar">
      <div class="brand">
        <div class="wordmark">Field Guide</div>
        <div class="volume">Vol. I — Insecta &amp; Aves</div>
        <div class="compiled">compiled 2026 · specimens in 3D</div>
      </div>

      <div class="controls">
        <div class="search-wrap">
          <input id="search" type="search" placeholder="Search name, family, tag…" autocomplete="off" />
          <span class="kbd">/</span>
        </div>
        <div class="controls-row">
          <label for="sort">Sort</label>
          <select id="sort">
            <option value="catalog">Catalog №</option>
            <option value="name-asc">Name A–Z</option>
            <option value="name-desc">Name Z–A</option>
            <option value="family">By family</option>
          </select>
        </div>
        <span id="matchCount" class="match-count"></span>
      </div>

      <nav id="nav" class="nav" aria-label="Species index"></nav>

      <div class="sidebar-foot">
        3D specimens streamed from Sketchfab ·<br />
        add a species in <b>data.js</b> — one line per model
      </div>
    </aside>

    <main id="main" class="main">
      <div id="view" class="view"></div>
    </main>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
