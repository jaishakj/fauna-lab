<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fauna Lab — Explore. Learn. Protect.</title>
<meta name="description" content="An interactive field guide to insects and birds.">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="mobile-header">
    <button class="hamburger" onclick="App.toggleSidebar(true)" aria-label="Open menu">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <strong style="font-family:'Fraunces',serif;font-size:16px;">Fauna Lab</strong>
    <span style="width:36px"></span>
  </div>

  <div class="shell">
    <div class="overlay" id="sidebarOverlay" onclick="App.toggleSidebar(false)"></div>
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main" id="main"></main>
    <aside class="detail-panel" id="detailPanel"></aside>
  </div>

  <!-- Notebook drawer -->
  <div class="overlay" id="drawerOverlay" onclick="App.closeNotebook()"></div>
  <div class="drawer" id="notebookDrawer"></div>

  <!-- Compare tray + modal -->
  <div class="compare-tray hide" id="compareTray"></div>
  <div class="compare-modal-wrap" id="compareModalWrap" onclick="if(event.target===this) App.closeCompare()">
    <div class="compare-modal" id="compareModal"></div>
  </div>

  <!-- About modal -->
  <div class="compare-modal-wrap" id="aboutModalWrap" onclick="if(event.target===this) App.closeAbout()">
    <div class="compare-modal" id="aboutModal" style="max-width:520px;"></div>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" onclick="if(event.target===this) App.closeLightbox()">
    <button class="lightbox-close" onclick="App.closeLightbox()">✕</button>
    <img id="lightboxImg" alt="">
    <div class="placeholder-art" id="lightboxPh" style="display:none;max-width:420px;max-height:420px;width:60vw;height:60vw;">
      <span class="ph-initial"></span>
    </div>
  </div>

  <!-- AR modal -->
  <div class="ar-modal" id="arModal">
    <video class="ar-video" id="arVideo" autoplay playsinline muted></video>
    <div class="ar-error" id="arError"></div>
    <div class="ar-sticker" id="arSticker"></div>
    <div class="ar-topbar">
      <span class="ar-pill">AR Field View</span>
      <button class="ar-close" onclick="App.closeAR()">✕</button>
    </div>
    <div style="position:absolute;bottom:24px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:2;">
      <button class="ar-close" onclick="App.arGrow()" title="Bigger">＋</button>
      <button class="ar-close" onclick="App.arShrink()" title="Smaller">－</button>
    </div>
    <div class="ar-hint">Drag the sticker to place it &middot; use ＋ / － to resize</div>
  </div>

  <div class="toast-wrap" id="toastWrap"></div>

  <script src="data.js"></script>
  <script src="icons.js"></script>
  <script src="app.js"></script>
</body>
</html>
